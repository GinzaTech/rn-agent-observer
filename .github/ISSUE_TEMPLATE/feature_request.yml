name: Feature request
description: Propose a user-facing capability or improvement
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow or evidence gap, not only the desired command name.
      placeholder: When observing ..., users cannot reliably determine ...
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      options:
        - Functional testing and replay
        - Performance and memory
        - Security and privacy
        - Network and resilience
        - Accessibility and internationalization
        - Evidence and diagnosis
        - Provider or plugin platform
        - CI, packaging, reports, or community
        - Other
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Explain the smallest useful public behavior and what a user or agent can do with it.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence contract
      description: What source, timestamp, unit, availability state, artifact, or limitation should make the result trustworthy?
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Privacy, security, and device-action impact
      description: State what data or device state is read or changed, authorization requirements, and safe defaults.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the capability matrix.
          required: true
        - label: I am not using this public request to disclose a vulnerability.
          required: true
