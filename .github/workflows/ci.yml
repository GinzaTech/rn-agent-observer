name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quality gate (lint, format, build, unit tests)
        run: pnpm check

  package-smoke:
    name: Public package tarball smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build publishable entrypoints
        run: pnpm build

      - name: Pack and inspect all public packages
        run: pnpm pack:check

  assurance:
    name: Coverage and dependency assurance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public packages
        run: pnpm build

      - name: Enforce source coverage thresholds
        run: pnpm coverage:check

      - name: Query OSV for every locked dependency
        run: pnpm security:dependencies

  node-next:
    name: Node 24 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the complete source gate on the next Node LTS
        run: pnpm check

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  mcp:
    name: MCP server initialization (no device)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Initialize MCP server
        run: pnpm mcp:check

  action-smoke:
    name: Reusable Observer action smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RN_OBSERVER_RUNNER_HASH_SECRET: ci-fixture-only-not-a-secret
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - name: Install and build the action's exact source revision
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Prepare privacy-reduced runner baseline fixture
        id: runner-baseline
        shell: bash
        run: |
          mkdir -p .artifacts/action-runner
          printf '%s\n' '<testsuite><testcase classname="action" name="smoke" time="0.1" /></testsuite>' > .artifacts/action-runner/baseline.xml
          printf '%s\n' '<testsuite><testcase classname="action" name="smoke" time="0.2" /></testsuite>' > .artifacts/action-runner/current.xml
          baseline_json="$(node packages/cli/dist/index.js runner import .artifacts/action-runner/baseline.xml --runner generic)"
          baseline_path="$(printf '%s' "$baseline_json" | node -e "let source=''; process.stdin.setEncoding('utf8'); process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => process.stdout.write(JSON.parse(source).artifact.path));")"
          printf 'path=%s\n' "$baseline_path" >> "$GITHUB_OUTPUT"

      - name: Exercise the repository composite action without a device claim
        uses: ./
        with:
          cli-entrypoint: packages/cli/dist/index.js
          suite: smoke
          allow-not-verified: 'true'
          output-directory: .artifacts/action-smoke
          junit-report: .artifacts/action-runner/current.xml
          external-runner: generic
          runner-baseline-result: ${{ steps.runner-baseline.outputs.path }}

  android-export:
    name: Demo Android release artifacts (no device runtime)
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Generate and inspect the default Android manifest
        shell: pwsh
        run: |
          Remove-Item Env:RN_OBSERVER_SECURITY_LAB -ErrorAction SilentlyContinue
          pnpm --filter @rn-agent-observer/demo-expo exec expo prebuild --no-install --clean
          node scripts/check-demo-security-manifest.mjs default

      - name: Generate and inspect the SecurityLab opt-in manifest
        shell: pwsh
        run: |
          $env:RN_OBSERVER_SECURITY_LAB = '1'
          pnpm --filter @rn-agent-observer/demo-expo exec expo prebuild --no-install --clean
          node scripts/check-demo-security-manifest.mjs opt-in

      - name: Restore and re-check the default Android manifest
        shell: pwsh
        run: |
          Remove-Item Env:RN_OBSERVER_SECURITY_LAB -ErrorAction SilentlyContinue
          pnpm --filter @rn-agent-observer/demo-expo exec expo prebuild --no-install --clean
          node scripts/check-demo-security-manifest.mjs default

      - name: Export and inspect the Android JavaScript bundle
        run: pnpm android:export:check

      - name: Build release APK and AAB for the owned arm64 fixture
        shell: pwsh
        working-directory: apps/demo-expo/android
        run: |
          $env:NODE_ENV = 'production'
          .\gradlew.bat assembleRelease bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Enforce release size, signature and 16 KB alignment gates
        run: pnpm android:release:check

  android-emulator-smoke:
    name: Android API 30 runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.12
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Observer packages
        run: pnpm build

      - name: Generate the default demo Android project
        run: pnpm --filter @rn-agent-observer/demo-expo exec expo prebuild --no-install --clean

      - name: Enable KVM access
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run read-only Observer smoke on Android API 30
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/ci-android-emulator-smoke.sh
