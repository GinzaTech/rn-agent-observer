version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Bangkok
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      production-dependencies:
        patterns:
          - '*'
        exclude-patterns:
          - typescript
          - react
          - react-native
        dependency-type: production
      development-tooling:
        patterns:
          - '*'
        dependency-type: development
    ignore:
      # TypeScript 7 uses the new native compiler API and is not yet supported
      # by typescript-eslint. Keep 6.x security/patch updates flowing without
      # repeatedly opening an impossible grouped major update.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
